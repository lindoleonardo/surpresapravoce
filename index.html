<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uma Surpresa Especial ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            background: url("gifbrilho.jpg") center center / cover no-repeat fixed;;
            color: #b03060;
        }

        .heart {
            font-size: 75px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .sparkles {
            font-size: 24px;
            animation: sparkle 1.5s infinite alternate;
        }

        @keyframes sparkle {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 25px;
            background: #e75480;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            background: #c2185b;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="sparkles">✨ ✨ ✨</div>
    <div class="heart">💖</div>
    <div class="sparkles">✨ 💕 ✨</div>

    <h2>🤍 uma surpresa pro meu amor lindo 🤍</h2>

    <a href="0002.jpg" target="_blank">
        ✨ aperta aqui 🤭 ✨
    </a>

</body>
</html>
