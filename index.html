
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uma Surpresa Especial ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: "Comic Sans MS", cursive, sans-serif;
            background-image: url("gifbrilho.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #b03060;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Camada suave para destacar o texto */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255, 240, 245, 0.18);
            z-index: 0;
        }

        body > * {
            position: relative;
            z-index: 1;
        }

        .heart {
            font-size: 75px;
            animation: pulse 1s infinite;
            filter: drop-shadow(0 0 12px rgba(255, 80, 150, 0.7));
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        .sparkles {
            font-size: 24px;
            animation: sparkle 1.5s infinite alternate;
        }

        @keyframes sparkle {
            from {
                opacity: 0.4;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1.08);
            }
        }

        h2 {
            color: #b03060;
            text-shadow: 1px 1px 4px white;
            font-size: clamp(20px, 5vw, 30px);
            margin: 20px 0 10px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 25px;
            background: #e75480;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(199, 24, 91, 0.35);
            transition: background 0.3s, transform 0.3s;
        }

        a:hover {
            background: #c2185b;
            transform: scale(1.05);
        }

        @media (max-width: 480px) {
            .heart {
                font-size: 65px;
            }

            h2 {
                font-size: 22px;
            }

            a {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="sparkles">✨ ✨ ✨</div>

    <div class="heart">💖</div>

    <div class="sparkles">✨ 💕 ✨</div>

    <h2>🤍 uma surpresa pro meu amor lindo 🤍</h2>

    <a href="0002.jpg" target="_blank" rel="noopener noreferrer">
        ✨ aperta aqui 🤭 ✨
    </a>

</body>
</html>
